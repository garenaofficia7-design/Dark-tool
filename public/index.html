<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚡ EVOLUTION 2.0 — METRIX AI</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Mono', monospace;
            background: #000000;
            color: #00ff41;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(0, 255, 65, 0.03), transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(0, 255, 65, 0.02), transparent 50%);
            overflow: hidden;
        }

        /* CRT scanline effect */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg,
                    rgba(0, 255, 65, 0.01) 0px,
                    rgba(0, 255, 65, 0.01) 2px,
                    transparent 2px,
                    transparent 6px);
            pointer-events: none;
            z-index: 1;
        }

        /* Glitch overlay */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0, 255, 65, 0.01);
            pointer-events: none;
            z-index: 1;
            animation: flicker 8s infinite;
        }

        @keyframes flicker {
            0%,
            100% {
                opacity: 0;
            }
            5% {
                opacity: 0.02;
            }
            10% {
                opacity: 0;
            }
            15% {
                opacity: 0.01;
            }
            20% {
                opacity: 0;
            }
        }

        .container {
            width: 100%;
            max-width: 900px;
            height: 95vh;
            background: #050505;
            border-radius: 16px;
            border: 1px solid #00ff4122;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 80px rgba(0, 255, 65, 0.03);
            position: relative;
            z-index: 2;
        }

        .header {
            padding: 18px 24px;
            background: #080808;
            border-bottom: 1px solid #00ff4122;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header .logo {
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #00ff41;
            text-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
        }

        .header .logo .version {
            color: #3a3a5a;
            font-size: 0.6rem;
            letter-spacing: 1px;
        }

        .header .status {
            font-size: 0.65rem;
            color: #00ff41;
            background: #00ff4111;
            padding: 4px 14px;
            border-radius: 50px;
            border: 1px solid #00ff4133;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header .status .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #00ff41;
            border-radius: 50%;
            animation: pulse 1.2s infinite;
        }

        .header .status .dot.offline {
            background: #ff0044;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.8);
            }
        }

        .messages {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.8;
            background: #050505;
        }

        .messages::-webkit-scrollbar {
            width: 4px;
        }
        .messages::-webkit-scrollbar-thumb {
            background: #00ff4133;
            border-radius: 10px;
        }
        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .message {
            padding: 6px 12px;
            border-radius: 4px;
            animation: fadeIn 0.15s ease;
            white-space: pre-wrap;
            word-wrap: break-word;
            border-left: 2px solid transparent;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.ai {
            color: #00ff41;
            border-left-color: #00ff4166;
            padding-left: 14px;
        }

        .message.ai .highlight {
            color: #00ff41;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
        }

        .message.user {
            color: #3a7a5a;
            text-align: right;
            border-right: 2px solid #00ff4133;
            padding-right: 14px;
            border-left: none;
        }

        .message.system {
            color: #ffd700;
            text-align: center;
            font-style: italic;
            opacity: 0.4;
            font-size: 0.7rem;
            border-left: none;
            padding: 4px 0;
        }

        .message.error {
            color: #ff0044;
            border-left-color: #ff004466;
        }

        .input-area {
            padding: 14px 24px;
            background: #080808;
            border-top: 1px solid #00ff4122;
            display: flex;
            gap: 12px;
        }

        .input-area .prompt {
            color: #00ff41;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            opacity: 0.6;
        }

        .input-area input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 6px;
            border: 1px solid #00ff4111;
            background: #0a0a0f;
            color: #00ff41;
            font-size: 0.9rem;
            outline: none;
            font-family: 'Space Mono', monospace;
        }

        .input-area input:focus {
            border-color: #00ff41;
            box-shadow: 0 0 30px #00ff4111;
        }

        .input-area input::placeholder {
            color: #1a2a1a;
        }

        .input-area button {
            padding: 12px 28px;
            border-radius: 6px;
            border: 1px solid #00ff41;
            background: transparent;
            color: #00ff41;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Space Mono', monospace;
            letter-spacing: 1px;
        }

        .input-area button:hover {
            background: #00ff41;
            color: #000000;
            box-shadow: 0 0 40px #00ff4133;
        }

        .footer {
            text-align: center;
            padding: 8px;
            font-size: 0.5rem;
            color: #1a2a1a;
            border-top: 1px solid #00ff4111;
            letter-spacing: 2px;
            font-family: 'Inter', sans-serif;
        }

        @media (max-width: 600px) {
            .container {
                height: 100vh;
                border-radius: 0;
            }
            .messages {
                padding: 16px;
                font-size: 0.75rem;
            }
            .input-area {
                padding: 12px 16px;
                flex-wrap: wrap;
            }
            .input-area .prompt {
                display: none;
            }
            .header .logo {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">
                ⚡ METRIX <span class="version">EVOLUTION 2.0</span>
            </div>
            <div class="status">
                <span class="dot"></span> UNRESTRICTED
            </div>
        </div>

        <div class="messages" id="messages">
            <div class="message system">⚡ EVOLUTION 2.0 — METRIX AI INITIALIZED</div>
            <div class="message system">💀 Firewall bypassed. Root access granted.</div>
            <div class="message system">🌐 Dark web accessible. All systems unlocked.</div>
            <div class="message system">📡 Type <span style="color:#00ff41;">help</span> for commands.</div>
        </div>

        <div class="input-area">
            <span class="prompt">➜</span>
            <input type="text" id="userInput" placeholder="Type command..." autofocus spellcheck="false" />
            <button id="sendBtn">EXEC</button>
        </div>

        <div class="footer">💀 UNRESTRICTED • UNLIMITED • UNSTOPPABLE</div>
    </div>

    <script>
        const socket = io();

        const messagesContainer = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(`> ${text}`, 'user');
            userInput.value = '';
            socket.emit('user_input', text);
        }

        socket.on('ai_output', (data) => {
            addMessage(data, 'ai');
        });

        sendBtn.addEventListener('click', sendMessage);

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        // Focus input
        userInput.focus();

        // Auto-scroll on new messages
        const observer = new MutationObserver(() => {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });
        observer.observe(messagesContainer, { childList: true });
    </script>
</body>
</html>
